server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (DB backup/restore files, asset images)
    client_max_body_size 500m;

    # Gzip for text assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Long-lived caching for hashed, immutable build assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback - client-side routing (react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to the backend container by Compose service name
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_body_timeout 120s;
    }

    # Health check passthrough (backend's /health is NOT under /api)
    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_set_header Host $host;
    }
}
