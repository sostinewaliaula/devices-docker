name: Docker Build

# Builds and publishes the backend and frontend images to GHCR once a pull
# request has been MERGED into docker-deploy-setup. Closing a pull request
# without merging it does nothing, and neither does pushing to a feature branch.
# Run it by hand from the Actions tab (workflow_dispatch) to rebuild on demand.
on:
  pull_request:
    types: [closed]
    branches:
      - docker-deploy-setup
  workflow_dispatch:

jobs:
  build:
    # Skip pull requests that were closed without being merged
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # On a closed pull request github.sha is the temporary test-merge commit, not the
      # commit that landed on the branch, so use the real merge commit for checkout and tags.
      BUILD_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ env.BUILD_SHA }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ env.BUILD_SHA }}
            ghcr.io/${{ github.repository }}/frontend:latest
